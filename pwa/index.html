<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111820"><meta name="description" content="Русский и словенский. Разговорный и технический перевод с железнодорожным словарём."><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css"><title>RailSI Translate</title></head>
<body><div class="ambient"></div><div class="shell"><header><a class="brand" href="/"><img src="/icon.svg" alt="" width="46" height="46"><span>RailSI <b>Translate</b><small id="online">● Онлайн</small></span></a><div class="header-actions"><button class="icon" id="theme" aria-label="Переключить тему" data-icon="sun"></button><button class="icon" id="settings" aria-label="Настройки" data-icon="settings"></button></div></header>
<main><div class="intro"><span class="eyebrow">RU ↔ SL · ПЕРЕВОД БЕЗ ГРАНИЦ</span><h1 id="heading">Понимать друг друга.<br><span>В жизни и в работе.</span></h1><p id="subtitle">Разговорный перевод. Точная техническая терминология.</p></div>
<section class="glass translator" aria-label="Переводчик"><div class="languages"><span id="sourceName">Русский</span><button id="swap" class="swap" aria-label="Поменять языки" data-icon="swap"></button><span id="targetName">Slovenščina</span></div><label class="sr-only" for="input">Исходный текст</label><textarea id="input" maxlength="5000" placeholder="Введите текст по-русски…" spellcheck="false"></textarea><div class="input-tools"><div><button class="icon" id="mic" aria-label="Голосовой ввод" data-icon="mic"></button><button class="icon" id="paste" aria-label="Вставить" data-icon="paste"></button><button class="icon" id="clear" aria-label="Очистить" data-icon="clear"></button></div><span id="counter">0 / 5000</span></div><div class="translate-row"><span class="shortcut">Ctrl / ⌘ + Enter</span><button class="primary" id="translate"><span id="translateLabel">ПЕРЕВЕСТИ</span><span data-icon="arrow"></span></button></div></section>
<div id="error" role="alert" hidden></div>
<section id="resultCard" class="glass result" hidden aria-label="Результат перевода"><div class="result-head"><span class="eyebrow" id="resultLabel">ПЕРЕВОД</span><span class="badge" id="provider"></span></div><p id="result" aria-live="polite"></p><div id="warnings"></div><div class="result-tools"><button class="icon" id="copy" aria-label="Копировать" data-icon="copy"></button><button class="icon" id="share" aria-label="Поделиться" data-icon="share"></button><button class="icon" id="speak" aria-label="Озвучить" data-icon="volume"></button><button class="icon" id="stop" aria-label="Остановить озвучивание" data-icon="stop"></button><button class="icon" id="retry" aria-label="Повторить перевод" data-icon="retry"></button></div><div id="matches"></div></section>
<div class="quick-actions"><button id="phrases"><span data-icon="chat"></span><span id="phrasesLabel">Быстрые фразы</span><span>↗</span></button><button id="dictionary"><span data-icon="book"></span><span id="dictionaryLabel">Технический словарь</span><span>↗</span></button><button id="history"><span data-icon="history"></span><span id="historyLabel">История переводов</span><span>↗</span></button></div>
<div class="note"><span class="note-dot"></span><span id="noteText">Для разговоров, железных дорог и инженерных задач</span></div></main><footer><span>RAILSI TRANSLATE</span><span>Русский & Slovenščina</span><button id="install" hidden>Установить приложение ↗</button></footer></div>
<dialog id="sheet"><div class="sheet-head"><h2 id="sheetTitle"></h2><button id="closeSheet" class="icon" aria-label="Закрыть" data-icon="clear"></button></div><div id="sheetContent"></div></dialog><div id="toast" role="status" hidden></div><script src="/app.js" type="module"></script></body></html>
